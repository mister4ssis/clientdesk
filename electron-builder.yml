appId: com.clientdesk.app
productName: ClientDesk
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
extraResources:
  - from: src/main/database/migrations
    to: migrations
npmRebuild: true
buildDependenciesFromSource: false
publish:
  provider: github
  releaseType: release
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ClientDesk-${version}-${arch}.${ext}
  signAndEditExecutable: true
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ClientDesk
  uninstallDisplayName: ClientDesk
  deleteAppDataOnUninstall: false
mac:
  target:
    - dmg
linux:
  target:
    - AppImage
