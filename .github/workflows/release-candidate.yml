name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag da release candidate, por exemplo v0.9.0-rc.1"
        required: true
        type: string
  push:
    tags:
      - "v*-rc.*"

permissions:
  contents: write

jobs:
  release-candidate:
    runs-on: windows-latest
    env:
      MAIN_VITE_SUPABASE_URL: ${{ vars.MAIN_VITE_SUPABASE_URL }}
      MAIN_VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.MAIN_VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.release_tag }}"
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+-rc\.\d+$') {
            Write-Error "Release candidate tag must match vX.Y.Z-rc.N."
            exit 1
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Supabase build configuration
        run: npm run verify:supabase-build-env

      - name: Validate release candidate version
        run: npm run release:check -- ${{ steps.release.outputs.tag }}

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Package directory
        run: npm run package:dir

      - name: Verify package directory
        run: npm run test:package

      - name: Report signing mode
        env:
          HAS_WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK != '' }}
          HAS_WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD != '' }}
        shell: pwsh
        run: |
          if ($env:HAS_WINDOWS_CSC_LINK -eq "true" -and $env:HAS_WINDOWS_CSC_KEY_PASSWORD -eq "true") {
            Write-Output "Windows signing secrets are configured."
          } else {
            Write-Warning "Windows signing secrets are not configured. RC build will be unsigned and intended only for homologation."
          }

      - name: Build Windows installer
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          MAIN_VITE_UPDATE_CHANNEL: beta
        run: npm run package:win

      - name: Verify release candidate artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = Get-ChildItem -Path release -Recurse -File
          $forbidden = $files | Where-Object {
            $_.Name -match '\.env$|\.sqlite$|\.sqlite-wal$|\.sqlite-shm$|\.db$|\.log$|\.pfx$|\.key$|\.pem$'
          }
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Error "Forbidden artifact: $($_.FullName)" }
            exit 1
          }
          $installer = $files | Where-Object { $_.Extension -eq ".exe" } | Select-Object -First 1
          if (-not $installer) {
            Write-Error "Windows installer was not generated."
            exit 1
          }
          $metadata = $files | Where-Object { $_.Name -eq "latest.yml" } | Select-Object -First 1
          if (-not $metadata) {
            Write-Error "Updater metadata latest.yml was not generated."
            exit 1
          }
          $hashes = $files | Where-Object {
            $_.Extension -in ".exe", ".yml", ".blockmap"
          } | Get-FileHash -Algorithm SHA256
          $hashes | Format-Table -AutoSize | Out-File -FilePath release\artifact-checksums.txt
          @"
          ClientDesk Release Candidate technical report
          Tag: ${{ steps.release.outputs.tag }}
          Version validated against package.json.
          Artifacts checked for forbidden local data and credentials.
          This release is marked as prerelease and is not production.
          "@ | Out-File -FilePath release\rc-technical-report.txt

      - name: Publish prerelease assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          gh release view "${{ steps.release.outputs.tag }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ steps.release.outputs.tag }}" --title "${{ steps.release.outputs.tag }}" --notes "ClientDesk ${{ steps.release.outputs.tag }} - homologação" --verify-tag --prerelease
          }
          gh release upload "${{ steps.release.outputs.tag }}" release/*.exe release/*.yml release/*.blockmap release/artifact-checksums.txt release/rc-technical-report.txt --clobber

      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clientdesk-release-candidate
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
            release/artifact-checksums.txt
            release/rc-technical-report.txt
          if-no-files-found: error
